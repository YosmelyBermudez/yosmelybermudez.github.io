<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yosmely Bermúdez | AI & ML Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --cy:#4DD0E1;--og:#FF6B35;--yl:#FFB700;
  --wm:#FFF4C8;--du:#D7CCC8;--br:#8D6E63;
  --dark:#060200;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--dark);font-family:'JetBrains Mono',monospace;cursor:none}

#cur  {position:fixed;width:8px;height:8px;background:var(--cy);border-radius:50%;pointer-events:none;z-index:9999;mix-blend-mode:screen;transform:translate(-50%,-50%)}
#cur-r{position:fixed;width:26px;height:26px;border:1px solid rgba(77,208,225,.4);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%)}

/* ── LAYER 1: LIBRARY — no will-change so blend mode works across layers ── */
#lib{
  position:fixed;inset:-10%;
  background:url('./library-bg.jpg') center 40%/cover no-repeat;
  z-index:0;
}

/* ── LAYER 2: ATMOSPHERIC ── */
#vig {position:fixed;inset:0;background:radial-gradient(ellipse 95% 90% at 50% 45%,transparent 15%,rgba(4,1,0,.62) 100%);z-index:1;pointer-events:none}
#tint{position:fixed;inset:0;background:rgba(4,1,0,0);transition:background 1.4s ease;z-index:1;pointer-events:none}
#btm {position:fixed;bottom:0;left:0;right:0;height:65%;background:linear-gradient(to top,rgba(4,1,0,.96) 0%,rgba(4,1,0,.5) 50%,transparent 100%);z-index:1;pointer-events:none;opacity:0;transition:opacity 1.2s ease}
#btm.on{opacity:1}
/* Dark oval behind astronaut to improve contrast against bright center */
#csh{
  position:fixed;left:50%;top:46%;
  width:min(78vh,72vw);height:min(88vh,80vw);
  transform:translate(-50%,-50%);
  background:radial-gradient(ellipse 48% 58% at 50% 46%, rgba(4,1,0,.55) 0%, rgba(4,1,0,.18) 55%, transparent 72%);
  z-index:2;pointer-events:none;
}

/* ── LAYER 3: DUST ── */
#dust{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.dp{position:absolute;border-radius:50%;animation:drift linear infinite}
@keyframes drift{0%{transform:translate(0,0);opacity:0}8%{opacity:.7}92%{opacity:.25}100%{transform:translate(var(--dx),var(--dy));opacity:0}}

/* ── LAYER 4: ASTRONAUT GLOW (below astronaut) ── */
#ag{
  position:fixed;left:50%;top:46%;
  width:min(58vh,54vw);height:min(72vh,66vw);
  transform:translate(-50%,-50%);
  z-index:4;pointer-events:none;
  background:radial-gradient(ellipse 46% 56% at 50% 44%, rgba(77,208,225,.16) 0%, rgba(255,120,50,.05) 42%, transparent 68%);
  border-radius:50%;
  mix-blend-mode:screen;
}

/* ── LAYER 5: ASTRONAUT ──
   KEY: mix-blend-mode:screen is on the WRAPPER (not on the img).
   The wrapper creates a stacking context that screen-blends against
   the parent (which has the library). Black bg of the jpg → transparent.
   No will-change here so the stacking context isn't GPU-isolated.       ── */
#ast-wrap{
  position:fixed;left:50%;top:46%;
  width:min(72vh,64vw);
  aspect-ratio:1/1;
  transform:translate(-50%,-50%);
  z-index:5;pointer-events:none;
  mix-blend-mode:screen;
  transition:opacity .9s ease;
}
#ast-wrap img{
  width:100%;height:100%;display:block;
  /* Boost contrast so black bg gets more black → better transparency.
     Also boosts suit and LEDs so they're clearly visible after screen blend. */
  filter:contrast(2.2) brightness(1.18) saturate(1.25);
}

/* ── LAYER 6: BOKEH (warm Edison bulbs) ── */
#bk{position:fixed;inset:0;z-index:6;pointer-events:none}
.bkel{position:absolute;border-radius:50%;animation:bkP ease-in-out infinite alternate}
@keyframes bkP{0%{opacity:.65;transform:translate(-50%,-50%) scale(1)}100%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}

/* ── LAYER 7: LIGHT RAYS ── */
#rays{position:fixed;inset:0;z-index:7;pointer-events:none;overflow:hidden}
.ray{position:absolute;top:0;width:1px;background:linear-gradient(to bottom,transparent,rgba(255,228,130,.06) 35%,rgba(255,220,100,.04) 65%,transparent);transform-origin:top center;animation:rS ease-in-out infinite alternate}
@keyframes rS{0%{opacity:.35;transform:rotate(-2.5deg) scaleX(1)}100%{opacity:.85;transform:rotate(2.5deg) scaleX(3.5)}}

/* ── LOADER ── */
#ld{position:fixed;inset:0;background:#060200;z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;transition:opacity 1.5s ease}
#ld.out{opacity:0;pointer-events:none}
.ld-m{font-family:'Cormorant Garamond',serif;font-size:5rem;font-weight:300;color:var(--wm);letter-spacing:-.04em;opacity:.13}
.ld-m em{font-style:italic;color:var(--cy);opacity:1}
.ld-b{width:min(240px,60vw);height:1px;background:rgba(255,255,255,.07);position:relative;overflow:hidden}
.ld-f{position:absolute;inset-block:0;left:0;width:0;background:linear-gradient(90deg,var(--og),var(--cy));transition:width .2s ease;box-shadow:0 0 14px var(--cy)}
.ld-t{font-size:.6rem;color:var(--br);letter-spacing:.35em;text-transform:uppercase}

#prog{position:fixed;top:0;left:0;height:1px;background:linear-gradient(90deg,var(--og),var(--cy));z-index:80;width:0%;transition:width .7s ease;box-shadow:0 0 6px var(--cy)}

/* ── NAV DOTS ── */
#nav{position:fixed;right:1.6rem;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.85rem;z-index:50}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);cursor:pointer;transition:all .3s;position:relative}
.dot::after{content:attr(data-l);position:absolute;right:1.4rem;top:50%;transform:translateY(-50%);font-size:.55rem;letter-spacing:.2em;text-transform:uppercase;color:var(--du);white-space:nowrap;opacity:0;transition:opacity .3s}
.dot:hover::after,.dot.on::after{opacity:1}
.dot.on{background:var(--cy);box-shadow:0 0 10px var(--cy)}

/* ── HERO ── */
#hero{position:fixed;bottom:0;left:0;right:0;padding:clamp(1.5rem,4vw,3rem) clamp(2rem,5vw,4.5rem);z-index:20;opacity:0;transform:translateY(16px);transition:opacity .9s ease,transform .9s ease;pointer-events:none}
#hero::before{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(4,1,0,.78) 0%,rgba(4,1,0,.38) 55%,transparent 100%);pointer-events:none;z-index:-1}
#hero.vis{opacity:1;transform:translateY(0);pointer-events:all}
.h-name{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,9vw,7.5rem);font-weight:300;color:var(--wm);line-height:.88;letter-spacing:-.02em;text-shadow:0 2px 24px rgba(4,1,0,.7)}
.h-name em{font-style:italic;color:var(--cy)}
.h-role{font-size:clamp(.6rem,1.2vw,.8rem);color:var(--cy);letter-spacing:.5em;text-transform:uppercase;margin:.7rem 0 .9rem;text-shadow:0 0 18px rgba(77,208,225,.5)}
.h-tag{font-family:'Cormorant Garamond',serif;font-size:clamp(.9rem,1.4vw,1.1rem);color:rgba(222,204,176,.92);font-style:italic;max-width:500px;line-height:1.85;text-shadow:0 1px 14px rgba(4,1,0,.95),0 2px 6px rgba(4,1,0,.8)}
.sh{margin-top:1.9rem;font-size:.56rem;color:rgba(255,244,200,.6);letter-spacing:.35em;text-transform:uppercase;display:flex;align-items:center;gap:.5rem;animation:sPulse 2.5s ease-in-out infinite;text-shadow:0 1px 8px rgba(4,1,0,.9)}
.sh::before{content:'';display:inline-block;width:14px;height:1px;background:rgba(255,244,200,.4)}
@keyframes sPulse{0%,100%{opacity:.45}50%{opacity:1}}

/* ── SECTION PANEL ── */
#panel{position:fixed;bottom:0;left:0;right:0;z-index:40;height:0;overflow:hidden;transition:height .72s cubic-bezier(.4,0,.2,1)}
#panel.open{height:60vh}
#pi{position:absolute;bottom:0;left:0;right:0;height:60vh;display:flex;background:linear-gradient(170deg,rgba(8,3,1,.88) 0%,rgba(4,1,0,.97) 100%);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid rgba(255,107,53,.18);box-shadow:0 -30px 80px rgba(0,0,0,.6)}
#pl{width:clamp(100px,16vw,200px);flex-shrink:0;border-right:1px solid rgba(255,255,255,.05);padding:clamp(1.4rem,3vw,2.4rem) clamp(1rem,2vw,1.6rem);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
#pl-num{font-family:'Cormorant Garamond',serif;font-size:clamp(4.5rem,10vw,7.5rem);font-weight:300;line-height:1;letter-spacing:-.04em;color:rgba(255,107,53,.1);position:absolute;bottom:.8rem;right:.3rem}
#pl-lbl{font-size:.54rem;letter-spacing:.4em;text-transform:uppercase;color:var(--og);margin-bottom:.4rem}
#pl-tit{font-family:'Cormorant Garamond',serif;font-size:clamp(1rem,2vw,1.5rem);font-weight:300;color:var(--wm);line-height:1.12}
#pr{flex:1;padding:clamp(1.2rem,2.5vw,2rem) clamp(1.5rem,3vw,2.8rem);overflow-y:auto}
#pr::-webkit-scrollbar{width:2px}
#pr::-webkit-scrollbar-thumb{background:rgba(255,107,53,.25);border-radius:2px}
.ani{opacity:0;transform:translateY(20px);transition:opacity .55s ease,transform .55s ease}
.ani.in{opacity:1;transform:translateY(0)}

/* Content styles */
.s-body{font-family:'Cormorant Garamond',serif;font-size:clamp(.95rem,1.5vw,1.1rem);color:#BCA890;line-height:1.85;font-style:italic;max-width:680px}
.s-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:.55rem;margin-top:.5rem}
.s-stat{padding:.75rem 1rem;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025);text-align:center}
.s-stat-n{font-size:1.6rem;font-weight:300;color:var(--cy);font-family:'Cormorant Garamond',serif;line-height:1}
.s-stat-l{font-size:.53rem;color:var(--br);letter-spacing:.18em;text-transform:uppercase;margin-top:.25rem}
.exp{padding:.9rem 1.1rem;border-left:2px solid var(--og);background:rgba(255,107,53,.04);margin-bottom:.55rem}
.exp-t{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--wm);font-weight:400}
.exp-c{font-size:.57rem;color:var(--og);letter-spacing:.22em;text-transform:uppercase;margin:.25rem 0 .1rem}
.exp-d{font-size:.55rem;color:var(--br);margin-bottom:.55rem}
.tags{display:flex;flex-wrap:wrap;gap:.28rem}
.tag{font-size:.54rem;padding:.12rem .4rem;background:rgba(77,208,225,.06);border:1px solid rgba(77,208,225,.22);color:#4A94B0;letter-spacing:.05em}
.prj{display:flex;gap:.9rem;align-items:flex-start;padding:.85rem 1rem;border:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.02);margin-bottom:.45rem}
.prj-ico{font-size:1.3rem;flex-shrink:0;margin-top:.08rem}
.prj-n{font-family:'Cormorant Garamond',serif;font-size:1rem;color:var(--wm);margin-bottom:.25rem}
.prj-d{font-size:.62rem;color:#8A7A68;line-height:1.55;margin-bottom:.35rem}
.prj-s{font-size:.53rem;letter-spacing:.18em;text-transform:uppercase}
.stprod{color:#3AB26A}.stbeta{color:#B2A03A}
.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem 2rem}
.sk-cat{border-top:1px solid rgba(255,107,53,.2);padding-top:.6rem}
.sk-cat-n{font-size:.54rem;letter-spacing:.32em;text-transform:uppercase;color:var(--og);margin-bottom:.7rem}
.sk-item{margin-bottom:.6rem}
.sk-row{display:flex;justify-content:space-between;margin-bottom:.24rem}
.sk-nm{font-size:.62rem;color:var(--du)}
.sk-pc{font-size:.62rem;color:var(--cy)}
.sk-bar{height:2px;background:rgba(255,255,255,.07)}
.sk-f{height:100%;background:linear-gradient(90deg,var(--og),var(--cy));width:0;transition:width 1.5s cubic-bezier(.25,.46,.45,.94)}
.res{padding:.7rem 0;border-bottom:1px solid rgba(255,255,255,.06)}
.res-t{font-family:'Cormorant Garamond',serif;font-size:.95rem;color:var(--wm);font-style:italic;margin-bottom:.22rem}
.res-m{font-size:.57rem;color:var(--br);letter-spacing:.12em}
.cta{font-family:'Cormorant Garamond',serif;font-size:clamp(1.1rem,2vw,1.5rem);color:var(--wm);line-height:1.35;margin-bottom:.9rem;font-style:italic}
.c-links{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.clink{display:flex;align-items:center;gap:.7rem;padding:.75rem 1rem;border:1px solid rgba(255,255,255,.07);text-decoration:none;transition:all .25s;color:var(--du)}
.clink:hover{border-color:rgba(77,208,225,.35);background:rgba(77,208,225,.05);color:var(--cy)}
.clink-ico{font-size:1rem;flex-shrink:0}
.clink-l{font-size:.58rem;letter-spacing:.2em;text-transform:uppercase}
.clink-s{font-size:.52rem;color:var(--br);margin-top:.12rem}
.avail{font-size:.55rem;letter-spacing:.22em;text-transform:uppercase;color:var(--br);margin-top:.9rem;text-align:center;padding:.55rem;border:1px solid rgba(255,255,255,.05)}

/* ── ADMIN ── */
#adm{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(540px,92vw);background:rgba(13,27,42,.97);border:1px solid var(--cy);z-index:500;display:none;box-shadow:0 0 50px rgba(77,208,225,.2)}
#adm.open{display:block}
.ah{background:rgba(77,208,225,.07);padding:.7rem 1.2rem;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(77,208,225,.18)}
.aht{color:var(--cy);font-size:.66rem;letter-spacing:.3em;text-transform:uppercase}
.axb{color:var(--og);cursor:pointer;font-size:1.1rem}
.ab{padding:1.2rem}
.ao{color:var(--cy);font-size:.64rem;line-height:1.85;min-height:80px;border-bottom:1px solid rgba(77,208,225,.1);padding-bottom:.9rem;margin-bottom:.75rem;max-height:180px;overflow-y:auto}
.ar{display:flex;align-items:center;gap:.45rem}
.asy{color:var(--cy);font-size:.7rem}
#ain{background:transparent;border:none;color:var(--og);font-family:'JetBrains Mono',monospace;font-size:.68rem;outline:none;width:100%;caret-color:var(--cy)}

/* ── CONTACT FORM ── */
.cf-form{margin-top:.75rem}
.cf-row{margin-bottom:.55rem}
.cf-label{font-size:.53rem;letter-spacing:.22em;text-transform:uppercase;color:var(--br);display:block;margin-bottom:.22rem}
.cf-inp{width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:var(--wm);font-family:'JetBrains Mono',monospace;font-size:.7rem;padding:.5rem .7rem;outline:none;transition:border-color .2s;-webkit-appearance:none}
.cf-inp:focus{border-color:rgba(77,208,225,.4);background:rgba(77,208,225,.03)}
.cf-inp::placeholder{color:rgba(255,255,255,.15)}
textarea.cf-inp{resize:none;height:72px}
.cf-btn{width:100%;padding:.65rem;background:transparent;border:1px solid rgba(77,208,225,.3);color:var(--cy);font-family:'JetBrains Mono',monospace;font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;cursor:pointer;transition:all .25s;margin-top:.25rem}
.cf-btn:hover:not(:disabled){background:rgba(77,208,225,.07);border-color:var(--cy)}
.cf-btn:disabled{opacity:.35;cursor:not-allowed}
.cf-ok{font-size:.6rem;color:#3AB26A;letter-spacing:.12em;text-align:center;margin-top:.45rem;display:none;font-style:italic}
.cf-err{font-size:.58rem;color:#D05555;margin-top:.3rem;display:none}

/* ── ADMIN DASHBOARD (post-auth) ── */
#adm{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(600px,95vw);max-height:84vh;display:none;flex-direction:column;background:rgba(13,27,42,.97);border:1px solid var(--cy);z-index:500;box-shadow:0 0 50px rgba(77,208,225,.2)}
#adm.open{display:flex}
#adm-auth{padding:1.2rem;display:block}
#adm-dash{display:none;flex-direction:column;flex:1;overflow:hidden}
#adm-tabs{display:flex;border-bottom:1px solid rgba(77,208,225,.12);padding:.4rem .9rem 0;gap:.1rem;flex-shrink:0;overflow-x:auto}
.adm-tab{font-size:.54rem;letter-spacing:.22em;text-transform:uppercase;color:var(--br);padding:.35rem .8rem;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .2s}
.adm-tab.on{color:var(--cy);border-bottom-color:var(--cy)}
#adm-body{flex:1;overflow-y:auto;padding:.75rem .9rem}
#adm-body::-webkit-scrollbar{width:2px}
#adm-body::-webkit-scrollbar-thumb{background:rgba(77,208,225,.2)}
.msg-item{padding:.55rem .7rem;border:1px solid rgba(255,255,255,.06);margin-bottom:.35rem;cursor:pointer;transition:background .18s;border-radius:1px}
.msg-item:hover{background:rgba(255,255,255,.025)}
.msg-item.unread{border-left:2px solid var(--cy)}
.msg-from{font-size:.64rem;color:var(--wm);font-family:'Cormorant Garamond',serif}
.msg-email-s{font-size:.53rem;color:rgba(77,208,225,.7);margin:.1rem 0}
.msg-time{font-size:.51rem;color:var(--br)}
.msg-preview{font-size:.56rem;color:#7A6A58;margin-top:.18rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg-full{font-size:.62rem;color:#BCA890;margin-top:.45rem;line-height:1.65;display:none;padding-top:.45rem;border-top:1px solid rgba(255,255,255,.05)}
.prj-item{padding:.6rem .75rem;border:1px solid rgba(255,255,255,.06);margin-bottom:.4rem}
.prj-erow{display:flex;gap:.35rem;align-items:center;margin-bottom:.28rem}
.prj-ei{flex:1;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:var(--wm);font-family:'JetBrains Mono',monospace;font-size:.6rem;padding:.28rem .45rem;outline:none;transition:border-color .18s}
.prj-ei:focus{border-color:rgba(77,208,225,.3)}
.adb{font-size:.5rem;letter-spacing:.15em;text-transform:uppercase;padding:.26rem .55rem;border:1px solid;cursor:pointer;background:transparent;font-family:'JetBrains Mono',monospace;transition:all .18s;white-space:nowrap}
.adb-c{color:var(--cy);border-color:rgba(77,208,225,.28)}.adb-c:hover{background:rgba(77,208,225,.08)}
.adb-r{color:#D05555;border-color:rgba(208,85,85,.28)}.adb-r:hover{background:rgba(208,85,85,.08)}
.adb-g{color:#3AB26A;border-color:rgba(58,178,106,.28)}.adb-g:hover{background:rgba(58,178,106,.08)}
.adb-w{width:100%;margin-top:.5rem;padding:.4rem}
.adm-empty{font-size:.58rem;color:var(--br);text-align:center;padding:1.8rem;letter-spacing:.15em}
.adm-vis{font-size:.53rem;color:var(--br);display:flex;align-items:center;gap:.35rem;cursor:pointer;margin-top:.2rem}
.adm-vis input{accent-color:var(--cy)}
</style>
</head>
<body>

<div id="cur"></div>
<div id="cur-r"></div>

<div id="ld">
  <div class="ld-m">Y<em>B</em></div>
  <div class="ld-b"><div class="ld-f" id="lfill"></div></div>
  <div class="ld-t" id="ltxt">Opening the library...</div>
</div>

<div id="prog"></div>

<!-- Layer 1: Library background -->
<div id="lib"></div>
<!-- Layer 2: Atmospheric overlays -->
<div id="vig"></div>
<div id="tint"></div>
<div id="btm"></div>
<div id="csh"></div>
<!-- Layer 3: Dust -->
<div id="dust"></div>
<!-- Layer 4: Astronaut glow -->
<div id="ag"></div>
<!-- Layer 5: Astronaut — wrapper has mix-blend-mode, img has contrast filter -->
<div id="ast-wrap">
  <img id="ast" src="./astronaut.jpg" alt="">
</div>
<!-- Layer 6: Bokeh lights -->
<div id="bk"></div>
<!-- Layer 7: Light rays -->
<div id="rays"></div>

<div id="hero">
  <h1 class="h-name">Yosmely<br><em>Bermúdez</em></h1>
  <p class="h-role">AI &amp; ML Engineer</p>
  <p class="h-tag">Building production-ready AI systems<br>that transform noise into intelligence</p>
  <p class="sh">Scroll to explore</p>
</div>

<nav id="nav">
  <div class="dot on" data-s="0" data-l="Hero"></div>
  <div class="dot" data-s="1" data-l="About"></div>
  <div class="dot" data-s="2" data-l="Experience"></div>
  <div class="dot" data-s="3" data-l="Projects"></div>
  <div class="dot" data-s="4" data-l="Skills"></div>
  <div class="dot" data-s="5" data-l="Research"></div>
  <div class="dot" data-s="6" data-l="Contact"></div>
</nav>

<div id="panel">
  <div id="pi">
    <div id="pl">
      <div><div id="pl-lbl"></div><div id="pl-tit"></div></div>
      <div id="pl-num">00</div>
    </div>
    <div id="pr"></div>
  </div>
</div>

<div id="adm">
  <div class="ah">
    <span class="aht">// Admin · YB Portfolio</span>
    <span class="axb" id="admx">×</span>
  </div>
  <!-- Auth screen -->
  <div id="adm-auth">
    <div class="ao" id="aout">> SISTEMA v2.0<br>> Auth required...<br></div>

function goTo(idx){

  else{heroEl.classList.remove('vis');astWrap.style.opacity='0.7';closeSection(()=>openSection(cur));}
}

const KO=['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];let ki=0;
window.addEventListener('keydown',e=>{ki=e.key===KO[ki]?ki+1:(e.key===KO[0]?1:0);if(ki===KO.length){ki=0;document.getElementById('lib').style.filter='hue-rotate(180deg) saturate(1.8)';setTimeout(()=>document.getElementById('lib').style.filter='',4000);}});

// ════════════════════════════════════════════════════════
// ATMOSPHERE
// ════════════════════════════════════════════════════════
function buildRays(){const c=document.getElementById('rays');[18,35,50,62,78].forEach((l,i)=>{const d=document.createElement('div');d.className='ray';d.style.cssText=`left:${l}%;height:${52+i*7}%;animation-duration:${5.2+i*1.2}s;animation-delay:${-i*1.0}s`;c.appendChild(d);});}
function buildDust(){const c=document.getElementById('dust');for(let i=0;i<65;i++){const d=document.createElement('div');d.className='dp';const sz=1+Math.random()*2.8;d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${sz}px;height:${sz}px;background:rgba(${210+Math.random()*30|0},${190+Math.random()*20|0},${155+Math.random()*20|0},.6);animation-duration:${9+Math.random()*13}s;animation-delay:${-Math.random()*18}s;--dx:${(Math.random()-.5)*80}px;--dy:${-50-Math.random()*130}px`;c.appendChild(d);}}
function buildBokeh(){const c=document.getElementById('bk');[{l:'17%',t:'20%',w:70,h:70,col:'rgba(255,215,80,.2)',dur:3.1},{l:'79%',t:'16%',w:65,h:65,col:'rgba(255,210,75,.18)',dur:2.7},{l:'36%',t:'37%',w:55,h:55,col:'rgba(255,220,90,.16)',dur:3.8},{l:'88%',t:'38%',w:50,h:50,col:'rgba(255,205,70,.14)',dur:2.5},{l:'50%',t:'44%',w:240,h:280,col:'rgba(255,238,180,.07)',dur:4.5},{l:'28%',t:'55%',w:40,h:40,col:'rgba(255,200,65,.10)',dur:2.3},{l:'71%',t:'58%',w:35,h:35,col:'rgba(255,200,65,.10)',dur:2.9}].forEach(b=>{const el=document.createElement('div');el.className='bkel';el.style.cssText=`left:${b.l};top:${b.t};width:${b.w}px;height:${b.h}px;background:radial-gradient(circle,${b.col} 0%,transparent 70%);animation-duration:${b.dur}s`;c.appendChild(el);});}

// ════════════════════════════════════════════════════════
// ANIMATION LOOP
// ════════════════════════════════════════════════════════
const libEl=document.getElementById('lib'),agEl=document.getElementById('ag'),cshEl=document.getElementById('csh');
function tick(ts){
  requestAnimationFrame(tick);
  if(!tStart)tStart=ts;
  const t=(ts-tStart)/1000;

  // Slow lerp for library (5px parallax)
  cmx+=(mx-cmx)*.038; cmy+=(my-cmy)*.038;
  // Fast lerp for astronaut (20px parallax)
  fmx+=(mx-fmx)*.07; fmy+=(my-fmy)*.07;

  // Library: waypoint pan/zoom + slow mouse parallax
  libScale+=(tScale-libScale)*.026;
  libTX+=(tTX-libTX)*.026;
  libTY+=(tTY-libTY)*.026;
  const libPX=cmx*5, libPY=cmy*4;
  const libFloat=Math.sin(t*.52)*2.5;
  libEl.style.transform=`scale(${libScale}) translate(${libTX-libPX}px,${libTY-libPY+libFloat}px)`;

  // Astronaut: fast parallax + strong independent float
  const astPX=fmx*20, astPY=fmy*14;
  const floatY=Math.sin(t*.62)*14;
  const breathe=Math.sin(t*.62)*.025+.975;
  astWrap.style.transform=`translate(calc(-50% + ${astPX}px),calc(-50% + ${astPY+floatY}px)) scale(${breathe})`;

  // Glow follows at 70% of astronaut speed
  const agPX=fmx*14, agPY=fmy*10;
  const glowP=Math.sin(t*1.2)*.2+.8;
  agEl.style.opacity=glowP*.9;
  agEl.style.transform=`translate(calc(-50% + ${agPX}px),calc(-50% + ${agPY+floatY*.6}px))`;

  // Shadow follows astronaut
  cshEl.style.transform=`translate(calc(-50% + ${agPX*.7}px),calc(-50% + ${agPY*.7+floatY*.45}px))`;

  // Cursor
  crx+=(cx-crx)*.11; cry+=(cy-cry)*.11;
  curEl.style.transform=`translate(${cx}px,${cy}px) translate(-50%,-50%)`;
  ringEl.style.transform=`translate(${crx}px,${cry}px) translate(-50%,-50%)`;
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
buildRays(); buildDust(); buildBokeh();
const astImg=document.getElementById('ast');
let loaded=0;
const phrases=['Opening the library...','Suiting up the astronaut...','Calibrating parallax layers...','Aligning the stars...'];
let prog=0,phi=0;
const lfill=document.getElementById('lfill'),ltxt=document.getElementById('ltxt');
const fakeLoad=setInterval(()=>{prog=Math.min(90,prog+Math.random()*6+2);lfill.style.width=prog+'%';if(prog>phi*22&&phi<phrases.length)ltxt.textContent=phrases[phi++];},80);
function onLoaded(){loaded++;if(loaded<2)return;clearInterval(fakeLoad);lfill.style.width='100%';setTimeout(()=>{document.getElementById('ld').classList.add('out');heroEl.classList.add('vis');requestAnimationFrame(tick);},650);}

const libImg=new Image();
libImg.onload=()=>{libEl.style.backgroundImage=`url('${libImg.src}')`;onLoaded();};
libImg.onerror=()=>{libEl.style.background='radial-gradient(ellipse 80% 80% at 50% 40%, #3D2008 0%, #1C0B04 50%, #060200 100%)';onLoaded();};
libImg.src='./library-bg.jpg';

astImg.addEventListener('load',onLoaded);
astImg.addEventListener('error',onLoaded);
if(astImg.complete)onLoaded();
</script>
